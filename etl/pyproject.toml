[project]
name = "relive-etl"
version = "0.1.0"
description = "ETL for Relive the Round: GRID VALORANT feeds -> clutch levels"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "zstandard>=0.25.0",
]

[project.scripts]
relive-spike = "relive_etl.spike:main"
relive-export-levels = "relive_etl.levels:main"
relive-calib-anchors = "relive_etl.calib:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
